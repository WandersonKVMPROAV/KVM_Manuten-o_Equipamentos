<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Manutenção — KVM Pro AV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- Tokens de marca (mesmos do app de Técnicos Volantes) ---- */
    --teal:#1C7A88;
    --teal-dark:#125A66;
    --teal-tint:#E4F1F2;
    --navy:#2E4756;
    --gold:#D9A04B;
    --gold-tint:#FBF0DE;
    --sage:#4C8B6E;
    --sage-tint:#E4F0EA;
    --plum:#6B5CA5;
    --plum-tint:#ECE8F5;
    --terracotta:#C1584B;
    --terracotta-tint:#F8E7E4;

    /* ---- Tokens neutros (modo claro) ---- */
    --bg:#F5F7F6;
    --surface:#FFFFFF;
    --border:#E1E7E6;
    --text:#20303A;
    --text-muted:#657078;

    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
    --shadow-1: 0 1px 2px rgba(32,48,58,.06);
    --shadow-2: 0 8px 24px rgba(32,48,58,.10);

    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;}
  html,body{height:100%;margin:0;}
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{font-family:'Space Grotesk',system-ui,sans-serif;}
  button{font-family:inherit; cursor:pointer;}
  a{color:var(--teal-dark);}

  ::-webkit-scrollbar{ height:10px; width:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1517; --surface:#182024; --border:#283134; --text:#EAF0EF; --text-muted:#8B9A9E;
      --teal-tint:#0F3339; --gold-tint:#332714; --sage-tint:#173023; --plum-tint:#251F38; --terracotta-tint:#331715;
      --shadow-1: 0 1px 2px rgba(0,0,0,.28); --shadow-2: 0 8px 24px rgba(0,0,0,.32);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1517; --surface:#182024; --border:#283134; --text:#EAF0EF; --text-muted:#8B9A9E;
    --teal-tint:#0F3339; --gold-tint:#332714; --sage-tint:#173023; --plum-tint:#251F38; --terracotta-tint:#331715;
    --shadow-1: 0 1px 2px rgba(0,0,0,.28); --shadow-2: 0 8px 24px rgba(0,0,0,.32);
  }

  /* ===================== Shell: barra lateral + coluna principal ===================== */
  .app-shell{ display:flex; min-height:100%; }
  .sidebar{
    width:248px; flex:none; background:var(--navy); color:#fff;
    display:flex; flex-direction:column; padding:20px 14px 16px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
    padding-top:calc(20px + env(safe-area-inset-top,0px));
    transition: margin-left .18s ease;
  }
  .app-shell.sidebar-hidden .sidebar{ margin-left:-248px; }
  .sidebar-brand{
    display:flex; align-items:center; gap:10px;
    padding:2px 8px 18px; border-bottom:1px solid rgba(255,255,255,.14); margin-bottom:12px;
  }
  .sidebar-brand img{ height:28px; width:auto; flex:none; }
  .sidebar-brand .title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px; line-height:1.2; }
  .sidebar-brand .subtitle{ font-size:11px; color:rgba(255,255,255,.62); }
  .sidebar-nav{ display:flex; flex-direction:column; gap:3px; }
  .sidebar-nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
    color:rgba(255,255,255,.72); font-size:13.5px; font-weight:600; cursor:pointer;
    background:transparent; border:none; text-align:left; width:100%; font-family:inherit;
    transition:background .12s ease, color .12s ease;
  }
  .sidebar-nav-item:hover{ background:rgba(255,255,255,.07); color:#fff; }
  .sidebar-nav-item.active{ background:var(--teal); color:#fff; }
  .sidebar-nav-item .icon{ font-size:15px; width:18px; text-align:center; flex:none; }
  .sidebar-foot{ margin-top:auto; padding-top:14px; font-size:10.5px; color:rgba(255,255,255,.4); }

  .main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .main-topbar{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:12px 22px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    position:sticky; top:0; z-index:20;
    padding-top:calc(12px + env(safe-area-inset-top,0px));
  }
  .sidebar-toggle-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    width:36px; height:36px; border-radius:var(--radius-sm); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .sidebar-toggle-btn:hover{ background:var(--bg); }
  main{ max-width:1240px; width:100%; margin:0 auto; padding:22px 20px 60px; }

  @media (max-width:860px){
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:static; flex-direction:row; align-items:center; padding:12px 14px; overflow-x:auto; }
    .app-shell.sidebar-hidden .sidebar{ display:none; margin-left:0; }
    .sidebar-brand{ border-bottom:none; border-right:1px solid rgba(255,255,255,.14); margin-bottom:0; padding:0 14px 0 2px; flex:none; }
    .sidebar-nav{ flex-direction:row; padding-left:10px; }
    .sidebar-nav-item{ white-space:nowrap; }
    .sidebar-foot{ display:none; }
  }

  /* ===================== Botões e filtros ===================== */
  select.filter-select, input.filter-select{
    border:1px solid var(--border); background:var(--surface); padding:8px 12px;
    border-radius:var(--radius-sm); color:var(--text); font-weight:500; cursor:pointer; font-size:13.5px;
    font-family:inherit;
  }
  input.filter-select{ cursor:text; }
  .btn{
    border:none; padding:9px 16px; border-radius:var(--radius-sm); font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; font-size:13.5px; white-space:nowrap;
  }
  .btn-primary{ background:var(--teal); color:#fff; }
  .btn-primary:hover{ background:var(--teal-dark); }
  .btn-ghost{ background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-ghost:hover{ background:var(--bg); }
  .danger-link{ border:none; background:none; color:var(--terracotta); font-size:13px; font-weight:600; padding:8px 4px; }
  .danger-link:hover{ text-decoration:underline; }

  input:focus, select:focus, button:focus-visible{ outline:2px solid var(--teal); outline-offset:1px; }

  /* ===================== Cabeçalho de página: faixa em degradê ===================== */
  .page-banner{
    background:linear-gradient(135deg, var(--navy) 0%, var(--teal-dark) 100%);
    color:#fff; border-radius:var(--radius-lg); padding:18px 22px;
    position:relative; overflow:hidden; margin-bottom:18px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  .page-banner::after{
    content:""; position:absolute; top:-40px; right:-30px; width:130px; height:130px;
    border-radius:50%; background:rgba(255,255,255,.07); pointer-events:none;
  }
  .page-banner h2{ margin:0; font-size:19px; position:relative; }
  .page-banner p{ margin:2px 0 0; font-size:13px; color:rgba(255,255,255,.78); position:relative; }

  /* ===================== Dashboard: cards de destaque (hero) ===================== */
  .dash-hero-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px; }
  .dash-hero-card{
    position:relative; overflow:hidden; border-radius:var(--radius-lg);
    background:linear-gradient(135deg, var(--navy) 0%, var(--teal-dark) 100%);
    color:#fff; padding:22px 24px; min-height:150px;
  }
  .dash-hero-card.alert-variant{ background:linear-gradient(135deg, var(--navy) 0%, #7A3C30 100%); }
  .dash-hero-card::after{
    content:""; position:absolute; top:-40px; right:-30px; width:140px; height:140px;
    border-radius:50%; background:rgba(255,255,255,.06);
  }
  .dash-hero-label{ font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); position:relative; }
  .dash-hero-card.alert-variant .dash-hero-label{ color:#F0B2A2; }
  .dash-hero-date{ font-family:'Space Grotesk',sans-serif; font-size:40px; font-weight:700; margin:4px 0 2px; position:relative; line-height:1; }
  .dash-hero-sub{ font-size:13px; color:rgba(255,255,255,.75); margin-bottom:14px; position:relative; }
  .dash-hero-items{ display:flex; flex-wrap:wrap; gap:8px; position:relative; }
  .dash-hero-item{ background:rgba(255,255,255,.12); border-radius:12px; padding:8px 12px; min-width:0; }
  .dash-hero-item .i-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px; color:#fff; }
  .dash-hero-item .i-sub{ font-size:11px; color:rgba(255,255,255,.8); margin-top:1px; }

  /* ===================== Dashboard: cards de indicador (stat) ===================== */
  .dash-stats-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
  .dash-stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:16px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-1);
  }
  .dash-stat-icon{
    width:40px; height:40px; border-radius:10px; background:var(--teal-tint); color:var(--teal-dark);
    display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;
  }
  .dash-stat-value{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; }
  .dash-stat-label{ font-size:11.5px; color:var(--text-muted); margin-top:1px; }

  @media (max-width:760px){
    .dash-hero-row{ grid-template-columns:1fr; }
    .dash-stats-row{ grid-template-columns:repeat(2,1fr); }
  }

  /* ===================== Seção / quadro de etapas ===================== */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin:0 0 14px; gap:12px; flex-wrap:wrap; }
  .section-head h2{ font-size:18px; margin:0; font-weight:700; font-family:'Space Grotesk',sans-serif; }
  .section-head .hint{ font-size:12.5px; color:var(--text-muted); }

  .board{ display:flex; gap:16px; overflow-x:auto; padding-bottom:12px; margin:0 -20px; padding-left:20px; padding-right:20px; }
  @media (max-width:640px){ .board{ margin:0 -14px; padding-left:14px; padding-right:14px; } main{ padding-left:14px; padding-right:14px; } }
  .column{ flex:0 0 272px; display:flex; flex-direction:column; gap:10px; }
  .column-head{ display:flex; align-items:center; justify-content:space-between; padding:2px 4px 8px; border-bottom:2px solid var(--stage-color, var(--teal)); }
  .column-head .name{ font-weight:700; font-size:13px; color:var(--text); }
  .column-head .count{
    font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700;
    background:var(--stage-color, var(--teal)); color:#fff; min-width:22px; height:22px; padding:0 6px;
    border-radius:999px; display:inline-flex; align-items:center; justify-content:center;
  }
  .column-body{ display:flex; flex-direction:column; gap:10px; min-height:40px; }
  .column-empty{ border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:18px 12px; text-align:center; color:var(--text-muted); font-size:12.5px; }

  /* ===================== Card de equipamento (formato "simple-card") ===================== */
  .card{
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--stage-color, var(--teal));
    border-radius:var(--radius-md); padding:14px; box-shadow:var(--shadow-1);
    display:flex; flex-direction:column; gap:10px;
  }
  .card.is-stale{ border-left-color:var(--terracotta); }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .card-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px; color:var(--text); }
  .card-model{ font-size:12px; color:var(--text-muted); margin-top:1px; }
  .card-menu-btn{ border:none; background:transparent; color:var(--text-muted); width:24px; height:24px; border-radius:6px; font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .card-menu-btn:hover{ background:var(--bg); color:var(--text); }
  .card-meta{ display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; }
  .meta-field .l{ font-size:10.5px; color:var(--text-muted); }
  .meta-field .v{ font-size:12.5px; color:var(--text); font-weight:500; margin-top:1px; }
  .card-tags{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; }
  .tag-bitrix-andamento{ background:var(--teal-tint); color:var(--teal-dark); }
  .tag-bitrix-ganha{ background:var(--gold-tint); color:#9A6B22; }
  .tag-bitrix-perdida{ background:var(--terracotta-tint); color:var(--terracotta); }
  .tag-nota{ background:var(--bg); color:var(--text-muted); border:1px solid var(--border); }
  .tag-stale{ background:var(--terracotta-tint); color:var(--terracotta); }
  .card-footer{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px; }
  .card-age{ font-size:11.5px; color:var(--text-muted); }
  .card-actions{ display:flex; gap:6px; }
  .icon-btn{ border:1px solid var(--border); background:var(--surface); color:var(--text-muted); width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .icon-btn:hover{ background:var(--bg); color:var(--text); }
  .advance-btn{ border:none; background:var(--navy); color:#fff; font-size:11.5px; font-weight:700; padding:7px 10px; border-radius:7px; white-space:nowrap; }
  .advance-btn:hover{ filter:brightness(1.12); }
  .advance-btn.gold{ background:var(--gold); color:#3A2A0E; }
  .advance-btn.gold:hover{ background:#C68F3C; }

  /* ===================== Filtros e tabela ===================== */
  .filters{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
  .filters input[type="search"]{ flex:1 1 220px; min-width:160px; }
  .filters select{ min-width:130px; }

  .table-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow:auto; box-shadow:var(--shadow-1); }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:880px; }
  thead th{ text-align:left; font-size:11.5px; font-weight:700; color:var(--text-muted); padding:12px 14px; border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0; background:var(--surface); }
  tbody td{ padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle; color:var(--text); white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--bg); }
  .cell-strong{ font-weight:700; }
  .cell-soft{ color:var(--text-muted); font-size:12.5px; }
  .row-actions{ display:flex; gap:6px; }
  .stage-chip{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; color:#fff; background:var(--stage-color, var(--teal)); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-muted); }
  .empty-state .icon{ font-size:34px; margin-bottom:10px; }
  .empty-state h3{ color:var(--text); font-size:16px; margin:0 0 6px; }
  .empty-state p{ margin:0; font-size:13.5px; }

  /* ===================== Modal ===================== */
  .modal-overlay{ position:fixed; inset:0; background:rgba(16,28,33,.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px calc(40px + env(safe-area-inset-bottom,0px)); overflow-y:auto; z-index:100; }
  .modal{ background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:620px; padding:26px; box-shadow:var(--shadow-2); }
  .modal h3{ margin:0 0 4px; font-size:19px; }
  .modal .modal-sub{ font-size:13px; color:var(--text-muted); margin:0 0 20px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.span2{ grid-column:1 / -1; }
  .field label{ font-size:12px; font-weight:700; color:var(--text-muted); }
  .field input, .field select{ font-family:inherit; font-size:14px; padding:9px 11px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text); }
  .modal-footer{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:10px; flex-wrap:wrap; }
  .modal-footer .right{ display:flex; gap:8px; margin-left:auto; }
  @media (max-width:560px){ .form-grid{ grid-template-columns:1fr; } .field.span2{ grid-column:auto; } }
  @media (prefers-reduced-motion: no-preference){
    .modal{ animation:pop .16s ease; }
    @keyframes pop{ from{ opacity:0; transform:translateY(6px) scale(.98);} to{ opacity:1; transform:none; } }
  }

  .toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--navy); color:#fff; font-size:13.5px; font-weight:500; padding:12px 18px; border-radius:999px; box-shadow:var(--shadow-2); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  /* ===================== Histórico ===================== */
  .hist-chip{ display:inline-flex; align-items:center; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .hist-ganha{ background:var(--sage-tint); color:var(--sage); }
  .hist-perdida{ background:var(--terracotta-tint); color:var(--terracotta); }
  .hist-neutro{ background:var(--bg); color:var(--text-muted); border:1px solid var(--border); }
  tbody tr.clickable{ cursor:pointer; }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin-top:6px; }
  .detail-grid .full{ grid-column:1 / -1; }
  .detail-grid .l{ font-size:11px; color:var(--text-muted); font-weight:700; }
  .detail-grid .v{ font-size:13.5px; color:var(--text); margin-top:2px; overflow-wrap:anywhere; }
  .banner-stats{ display:flex; gap:22px; position:relative; flex-wrap:wrap; }
  .banner-stats .n{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; line-height:1; }
  .banner-stats .t{ font-size:11.5px; color:rgba(255,255,255,.75); margin-top:3px; }
  @media (max-width:560px){ .detail-grid{ grid-template-columns:1fr; } }

  /* ===================== Interações: cards clicáveis, etapa, arrastar ===================== */
  .clickable{ cursor:pointer; }
  .dash-hero-card.clickable, .dash-stat-card.clickable{ transition:transform .12s ease, box-shadow .12s ease; }
  .dash-hero-card.clickable:hover, .dash-stat-card.clickable:hover{ transform:translateY(-2px); box-shadow:var(--shadow-2); }
  .dash-hero-item.clickable:hover{ background:rgba(255,255,255,.24); }
  .column-head[data-filter]{ cursor:pointer; }
  .column-head[data-filter]:hover .name{ text-decoration:underline; }
  .filter-chip{ display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.16); border-radius:999px; padding:6px 8px 6px 14px; font-size:12.5px; font-weight:600; position:relative; }
  .filter-chip button{ border:none; background:rgba(255,255,255,.24); color:#fff; border-radius:50%; width:22px; height:22px; font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center; }
  .filter-chip button:hover{ background:rgba(255,255,255,.4); }

  .card[draggable="true"]{ cursor:grab; }
  .card.dragging{ opacity:.4; }
  .column{ border-radius:var(--radius-md); transition:background .12s ease; }
  .column.drag-over{ background:var(--teal-tint); outline:2px dashed var(--stage-color, var(--teal)); outline-offset:4px; }
  .column-body{ min-height:60px; }

  .card-move{ display:flex; align-items:center; gap:8px; padding-top:8px; border-top:1px solid var(--border); }
  .card-move span{ font-size:11px; color:var(--text-muted); font-weight:700; flex:none; }
  .stage-select{ flex:1; min-width:0; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:7px; font-size:12px; font-weight:600; padding:5px 6px; font-family:inherit; cursor:pointer; }
  .stage-select-chip{ border:none; background:var(--stage-color, var(--teal)); color:#fff; border-radius:999px; font-size:11.5px; font-weight:700; padding:5px 10px; font-family:inherit; cursor:pointer; }
  .stage-select option, .stage-select-chip option, .field select option{ background:var(--surface); color:var(--text); }

  /* ===================== Tela de Resumo (16:9, para TV / AdMooh) ===================== */
  #btn-resumo-menu{ display:none; position:fixed; top:12px; left:12px; z-index:70; width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:16px; align-items:center; justify-content:center; opacity:.3; transition:opacity .15s ease; }
  #btn-resumo-menu:hover, #btn-resumo-menu:focus-visible{ opacity:1; }
  #resumo-backdrop{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:55; }
  .app-shell.resumo-mode{ height:100vh; overflow:hidden; }
  .app-shell.resumo-mode .main-topbar{ display:none; }
  .app-shell.resumo-mode main{ max-width:none; padding:0; margin:0; }
  .app-shell.resumo-mode #btn-resumo-menu{ display:flex; }
  .app-shell.resumo-mode.peek #btn-resumo-menu{ display:none; }
  .app-shell.resumo-mode.peek #resumo-backdrop{ display:block; }
  /* barra lateral oculta nesta tela (abre sobreposta pelo botão ☰) */
  .app-shell.resumo-mode .sidebar, .app-shell.resumo-mode.sidebar-hidden .sidebar{
    display:flex; position:fixed; left:0; top:0; z-index:60; width:248px; height:100vh; flex-direction:column; align-items:stretch;
    padding:calc(20px + env(safe-area-inset-top,0px)) 14px 16px; margin-left:-270px; overflow-y:auto; box-shadow:var(--shadow-2);
  }
  .app-shell.resumo-mode.peek .sidebar{ margin-left:0; }
  .app-shell.resumo-mode .sidebar-brand{ border-right:none; border-bottom:1px solid rgba(255,255,255,.14); margin-bottom:12px; padding:2px 8px 18px; }
  .app-shell.resumo-mode .sidebar-nav{ flex-direction:column; padding-left:0; }
  .app-shell.resumo-mode .sidebar-foot{ display:block; }

  .resumo-wrap{ position:fixed; inset:0; background:var(--bg); overflow:hidden; z-index:10; }
  .resumo-stage{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:top left; padding:40px 56px; display:flex; flex-direction:column; gap:24px; color:var(--text); }
  .rs-head{ height:96px; display:flex; align-items:center; gap:28px; flex:none; }
  .rs-head img{ height:64px; width:auto; display:block; }
  .rs-head .rs-div{ width:2px; height:56px; background:var(--border); }
  .rs-title{ font-family:'Space Grotesk',sans-serif; font-size:40px; font-weight:700; line-height:1.1; }
  .rs-sub{ font-size:20px; color:var(--text-muted); margin-top:4px; }
  .rs-clock{ margin-left:auto; text-align:right; }
  .rs-time{ font-family:'Space Grotesk',sans-serif; font-size:64px; font-weight:700; line-height:1; }
  .rs-date{ font-size:22px; color:var(--text-muted); text-transform:capitalize; margin-top:6px; }

  .rs-kpis{ display:grid; grid-template-columns:1.5fr repeat(4,1fr); gap:20px; height:160px; flex:none; }
  .rs-kpi{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:18px 24px; display:flex; align-items:center; gap:18px; min-width:0; }
  .rs-kpi .ic{ width:60px; height:60px; border-radius:16px; background:var(--teal-tint); font-size:28px; display:flex; align-items:center; justify-content:center; flex:none; }
  .rs-kpi .num{ font-family:'Space Grotesk',sans-serif; font-size:68px; font-weight:700; line-height:1; }
  .rs-kpi .lbl{ font-size:21px; color:var(--text-muted); margin-top:6px; line-height:1.2; }
  .rs-kpi.hero{ background:linear-gradient(135deg, var(--navy) 0%, var(--teal-dark) 100%); border:none; color:#fff; position:relative; overflow:hidden; }
  .rs-kpi.hero::after{ content:""; position:absolute; top:-60px; right:-40px; width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,.07); }
  .rs-kpi.hero .num{ font-size:104px; }
  .rs-kpi.hero .lbl{ color:rgba(255,255,255,.82); }
  .rs-kpi.hero .lbl b{ color:var(--gold); font-weight:700; }
  .rs-kpi.warn{ background:var(--terracotta-tint); border-color:transparent; }
  .rs-kpi.warn .ic{ background:rgba(193,88,75,.18); }
  .rs-kpi.warn .num{ color:var(--terracotta); }
  .rs-kpi.good .ic{ background:var(--sage-tint); }

  .rs-flow{ display:flex; gap:12px; height:104px; flex:none; }
  .rs-step{ flex:1; min-width:0; background:var(--surface); border:1px solid var(--border); border-top:6px solid var(--stage-color, var(--teal)); border-radius:16px; padding:10px 16px; display:flex; align-items:center; gap:14px; }
  .rs-step .n{ font-family:'Space Grotesk',sans-serif; font-size:52px; font-weight:700; line-height:1; }
  .rs-step .t{ font-size:19px; line-height:1.15; color:var(--text-muted); }
  .rs-step.zero{ opacity:.5; }

  .rs-main{ flex:1; min-height:0; display:grid; grid-template-columns:1.4fr 1fr; gap:20px; }
  .rs-right{ display:grid; grid-template-rows:1fr 1fr; gap:20px; min-height:0; }
  .rs-panel{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:16px 24px; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .rs-panel h3{ margin:0 0 8px; font-size:26px; display:flex; align-items:center; justify-content:space-between; gap:12px; font-weight:700; flex:none; }
  .rs-pill{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; background:var(--teal-tint); color:var(--teal); border-radius:999px; padding:2px 14px; }
  .rs-pill.warn{ background:var(--terracotta-tint); color:var(--terracotta); }
  .rs-pill.good{ background:var(--sage-tint); color:var(--sage); }
  .rs-row{ display:flex; align-items:center; gap:18px; border-top:1px solid var(--border); min-height:50px; }
  .rs-row:first-of-type{ border-top:none; }
  .rs-row.compact{ min-height:42px; }
  .rs-chip{ flex:none; width:250px; text-align:center; font-size:18px; font-weight:700; color:#fff; background:var(--stage-color, var(--teal)); border-radius:999px; padding:5px 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rs-name{ flex:1; min-width:0; font-size:24px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rs-name span{ font-size:20px; font-weight:500; color:var(--text-muted); margin-left:8px; }
  .rs-row.compact .rs-name{ font-size:22px; }
  .rs-row.compact .rs-name span{ font-size:18px; }
  .rs-cli{ flex:none; width:230px; font-size:22px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rs-row.compact .rs-cli{ width:190px; font-size:20px; }
  .rs-days{ flex:none; width:110px; text-align:right; font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; }
  .rs-days.stale{ color:var(--terracotta); }
  .rs-more{ font-size:19px; color:var(--text-muted); padding-top:8px; }
  .rs-empty{ flex:1; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--text-muted); }

  .rs-hist{ height:92px; flex:none; display:flex; align-items:center; gap:36px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:0 28px; }
  .rs-hist .ttl{ font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; line-height:1.15; flex:none; }
  .rs-hist .m{ flex:none; display:flex; align-items:baseline; gap:10px; }
  .rs-hist .m .n{ font-family:'Space Grotesk',sans-serif; font-size:44px; font-weight:700; line-height:1; }
  .rs-hist .m .l{ font-size:19px; color:var(--text-muted); }
  .rs-bar{ flex:1; min-width:120px; height:16px; border-radius:999px; background:var(--border); display:flex; overflow:hidden; }
  .rs-bar i{ display:block; height:100%; }
</style>
</head>

<script>
(function () {
  "use strict";

  /* ---------------- Stage definitions ---------------- */
  var STAGES = [
    { key: "PREVISTO",   name: "Previsto",                color: "#8FA3AA" },
    { key: "RECEBIDO",   name: "Recebido na KVM",          color: "var(--navy)", hex: "#2E4756" },
    { key: "ASSISTENCIA",name: "Em assistência",           color: "var(--teal)", hex: "#1C7A88" },
    { key: "ORCAMENTO",  name: "Orçamento / proposta",     color: "var(--plum)", hex: "#6B5CA5" },
    { key: "APROVADO",   name: "Aprovado",                 color: "var(--gold)", hex: "#D9A04B" },
    { key: "RETORNADO",  name: "Retornado / em bancada",    color: "var(--terracotta)", hex: "#C1584B" },
    { key: "PRONTO",     name: "Disponível para envio",    color: "var(--sage)", hex: "#4C8B6E" },
    { key: "ENVIADO",    name: "Enviado ao cliente",       color: "#8B9A9E" }
  ];
  var STAGE_MAP = {};
  STAGES.forEach(function (s) { STAGE_MAP[s.key] = s; });

  var TODAY = new Date(); TODAY.setHours(0,0,0,0);

  function parseDate(s) {
    if (!s) return null;
    var p = s.split("-");
    return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

  function computeAuto(item) {
    if (item.enviado) return { key: "ENVIADO", since: item.enviadoEm || item.retorno || item.chegada };
    if (item.prontoParaEnvio) return { key: "PRONTO", since: item.prontoDesde || item.retorno || item.chegada };
    if (item.retorno) return { key: "RETORNADO", since: item.retorno };
    if (item.aprovacao) return { key: "APROVADO", since: item.aprovacao };
    if (item.proposta || item.orcamento) return { key: "ORCAMENTO", since: item.proposta || item.orcamento };
    if (item.envioAssistencia) return { key: "ASSISTENCIA", since: item.envioAssistencia };
    if (item.chegada) return { key: "RECEBIDO", since: item.chegada };
    return { key: "PREVISTO", since: null };
  }

  // Etapa efetiva: se houver etapa definida manualmente (arrastar / lista suspensa), ela vale; senão, pelas datas
  function computeStage(item) {
    if (item.etapaManual && STAGE_MAP[item.etapaManual]) {
      return { key: item.etapaManual, since: item.etapaDesde || computeAuto(item).since };
    }
    return computeAuto(item);
  }
  function setStage(item, key) {
    item.etapaManual = key;
    item.etapaDesde = todayIso();
    item.prontoParaEnvio = (key === "PRONTO");
    item.enviado = (key === "ENVIADO");
    if (key === "PRONTO") item.prontoDesde = todayIso();
    if (key === "ENVIADO") item.enviadoEm = todayIso();
  }

  function ageDays(item) {
    var st = computeStage(item);
    if (!st.since) return null;
    return daysBetween(parseDate(st.since), TODAY);
  }

  function isStale(item) {
    var st = computeStage(item);
    if (st.key === "ENVIADO" || st.key === "PRONTO" || st.key === "PREVISTO") return false;
    var a = ageDays(item);
    return a !== null && a >= 20;
  }

  /* ---------------- Filtros pelos cards do painel ---------------- */
  var CARD_FILTERS = {
    ativos:    { label: "Em manutenção",           fn: function (it, k) { return ["RECEBIDO","ASSISTENCIA","ORCAMENTO","APROVADO","RETORNADO"].indexOf(k) !== -1; } },
    terceiros: { label: "Aguardando fornecedor",   fn: function (it, k) { return ["ASSISTENCIA","ORCAMENTO","APROVADO"].indexOf(k) !== -1; } },
    pronto:    { label: "Disponíveis para envio",  fn: function (it, k) { return k === "PRONTO"; } },
    enviado:   { label: "Enviados ao cliente",     fn: function (it, k) { return k === "ENVIADO"; } },
    alertas:   { label: "Alertas (parados 20+ dias)", fn: function (it, k) { return isStale(it); } }
  };
  var cardFilter = null;
  function matchCardFilter(it) {
    if (!cardFilter) return true;
    var k = computeStage(it).key;
    if (cardFilter.key.indexOf("etapa:") === 0) return k === cardFilter.key.slice(6);
    var f = CARD_FILTERS[cardFilter.key];
    return f ? f.fn(it, k) : true;
  }

  /* ---------------- State ---------------- */
  var dataEl = document.getElementById("equip-data");
  var state = { equipamentos: [] };
  try { state.equipamentos = JSON.parse(dataEl.textContent || "[]"); } catch (e) { state.equipamentos = []; }

  var activeTab = "resumo";

  var sidebarHidden = false;
  try { sidebarHidden = localStorage.getItem("kvm-sidebar-hidden") === "1"; } catch (e) {}
  function applySidebarState() {
    document.getElementById("app-shell").classList.toggle("sidebar-hidden", sidebarHidden);
  }
  applySidebarState();
  document.getElementById("btn-toggle-sidebar").addEventListener("click", function () {
    sidebarHidden = !sidebarHidden;
    applySidebarState();
    try { localStorage.setItem("kvm-sidebar-hidden", sidebarHidden ? "1" : "0"); } catch (e) {}
  });

  /* ---------------- Sidebar nav ---------------- */
  var NAV_ITEMS = [
    { id: "resumo", label: "Resumo (TV 16:9)", icon: "📺" },
    { id: "painel", label: "Painel", icon: "🏠" },
    { id: "equipamentos", label: "Equipamentos", icon: "🧰" },
    { id: "historico", label: "Histórico", icon: "📚" }
  ];
  function renderNav() {
    var wrap = document.getElementById("sidebarNav");
    wrap.innerHTML = "";
    NAV_ITEMS.forEach(function (v) {
      var b = document.createElement("button");
      b.className = "sidebar-nav-item" + (activeTab === v.id ? " active" : "");
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", activeTab === v.id ? "true" : "false");
      b.innerHTML = '<span class="icon">' + v.icon + '</span><span>' + v.label + '</span>';
      b.addEventListener("click", function () { activeTab = v.id; cardFilter = null; renderAll(); });
      wrap.appendChild(b);
    });
  }

  /* ---------------- Persistence ---------------- */
  var artifactApi = null;
  function initArtifact() {
    if (!window.claude || !window.claude.use) return;
    window.claude.use("artifact").then(function (a) { artifactApi = a; }).catch(function () {});
  }
  initArtifact();

  function persist() {
    dataEl.textContent = JSON.stringify(state.equipamentos);
    if (artifactApi) {
      try {
        var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        artifactApi.publish(html).catch(function () {});
      } catch (e) {}
    }
  }

  /* ---------------- Toast ---------------- */
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  function todayIso() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? "0"+n : ""+n; }
  function findItem(id) {
    for (var i = 0; i < state.equipamentos.length; i++) if (state.equipamentos[i].id === id) return state.equipamentos[i];
    return null;
  }
  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  /* ---------------- Render root ---------------- */
  function renderAll() {
    renderNav();
    var app = document.getElementById("app");
    var topbarFilters = document.getElementById("topbar-filters");
    app.innerHTML = "";
    topbarFilters.innerHTML = "";
    var shellEl = document.getElementById("app-shell");
    shellEl.classList.toggle("resumo-mode", activeTab === "resumo");
    shellEl.classList.remove("peek");
    if (activeTab === "resumo") renderResumo(app);
    else if (activeTab === "painel") renderPainel(app);
    else if (activeTab === "historico") renderHistorico(app, topbarFilters);
    else renderEquipamentos(app, topbarFilters);
  }

  /* ---------------- Painel (dashboard) ---------------- */
  function bitrixTag(status) {
    if (!status) return "";
    var cls = "tag-bitrix-andamento";
    var s = status.toUpperCase();
    if (s.indexOf("GANH") !== -1) cls = "tag-bitrix-ganha";
    else if (s.indexOf("PERD") !== -1) cls = "tag-bitrix-perdida";
    return '<span class="tag ' + cls + '">' + escapeHtml(status) + '</span>';
  }

  function renderPainel(container) {
    var items = state.equipamentos;
    var ativos = items.filter(function (it) {
      var s = computeStage(it).key;
      return ["RECEBIDO","ASSISTENCIA","ORCAMENTO","APROVADO","RETORNADO"].indexOf(s) !== -1;
    });
    var aguardandoTerceiros = items.filter(function (it) {
      var s = computeStage(it).key;
      return ["ASSISTENCIA","ORCAMENTO","APROVADO"].indexOf(s) !== -1;
    }).length;
    var prontos = items.filter(function (it) { return computeStage(it).key === "PRONTO"; }).length;
    var enviados = items.filter(function (it) { return computeStage(it).key === "ENVIADO"; }).length;
    var ages = ativos.map(ageDays).filter(function (a) { return a !== null; });
    var media = ages.length ? Math.round(ages.reduce(function (a,b) { return a+b; }, 0) / ages.length) : 0;
    var staleItems = items.filter(isStale);

    // ---- Hero row: 2 cards (em manutenção / alertas) ----
    var stageBreakdown = STAGES.filter(function (s) {
      return ["RECEBIDO","ASSISTENCIA","ORCAMENTO","APROVADO","RETORNADO"].indexOf(s.key) !== -1;
    }).map(function (s) {
      var n = items.filter(function (it) { return computeStage(it).key === s.key; }).length;
      return { s: s, n: n };
    }).filter(function (x) { return x.n > 0; });

    var hero = document.createElement("div");
    hero.className = "dash-hero-row";
    hero.innerHTML =
      '<div class="dash-hero-card clickable" data-filter="ativos" role="button" tabindex="0" title="Ver os equipamentos em manutenção">' +
        '<div class="dash-hero-label">Em manutenção agora</div>' +
        '<div class="dash-hero-date">' + ativos.length + '</div>' +
        '<div class="dash-hero-sub">' + (ativos.length === 1 ? "equipamento sendo acompanhado" : "equipamentos sendo acompanhados") + '</div>' +
        '<div class="dash-hero-items">' +
          (stageBreakdown.length
            ? stageBreakdown.map(function (x) {
                return '<div class="dash-hero-item clickable" data-filter="etapa:' + x.s.key + '" role="button" tabindex="0" title="Ver equipamentos desta etapa"><div class="i-title">' + x.n + '</div><div class="i-sub">' + x.s.name + '</div></div>';
              }).join("")
            : '<div class="dash-hero-item"><div class="i-title">0</div><div class="i-sub">Nenhum equipamento ativo</div></div>') +
        '</div>' +
      '</div>' +
      '<div class="dash-hero-card clickable' + (staleItems.length ? ' alert-variant' : '') + '" data-filter="alertas" role="button" tabindex="0" title="Ver os equipamentos parados">' +
        '<div class="dash-hero-label">Alertas</div>' +
        '<div class="dash-hero-date">' + staleItems.length + '</div>' +
        '<div class="dash-hero-sub">' + (staleItems.length ? "parados há 20+ dias numa etapa" : "nenhum equipamento parado há muito tempo") + '</div>' +
        '<div class="dash-hero-items">' +
          staleItems.slice(0, 4).map(function (it) {
            var a = ageDays(it);
            return '<div class="dash-hero-item"><div class="i-title">' + a + 'd</div><div class="i-sub">' + escapeHtml(it.cliente || it.equipamento || "") + '</div></div>';
          }).join("") +
          (staleItems.length > 4 ? '<div class="dash-hero-item"><div class="i-title">+' + (staleItems.length - 4) + '</div><div class="i-sub">outros</div></div>' : "") +
        '</div>' +
      '</div>';
    container.appendChild(hero);
    bindFilterClicks(hero);

    // ---- Stats row ----
    var stats = [
      { icon: "🛠️", value: aguardandoTerceiros, label: "aguardando fornecedor", filter: "terceiros" },
      { icon: "📦", value: prontos, label: "disponíveis p/ envio", filter: "pronto" },
      { icon: "✅", value: enviados, label: "enviados ao cliente", filter: "enviado" },
      { icon: "⏱️", value: media, label: "dias parado (média)", filter: "ativos" }
    ];
    var statsRow = document.createElement("div");
    statsRow.className = "dash-stats-row";
    statsRow.innerHTML = stats.map(function (s) {
      return '<div class="dash-stat-card clickable" data-filter="' + s.filter + '" role="button" tabindex="0">' +
        '<div class="dash-stat-icon">' + s.icon + '</div>' +
        '<div><div class="dash-stat-value">' + s.value + '</div><div class="dash-stat-label">' + s.label + '</div></div>' +
      '</div>';
    }).join("");
    container.appendChild(statsRow);
    bindFilterClicks(statsRow);

    // ---- Section head + board ----
    var sectionHead = document.createElement("div");
    sectionHead.className = "section-head";
    sectionHead.innerHTML = '<h2>Fluxo de manutenção</h2><div class="hint">arraste os cards entre as colunas ou use a lista "Etapa" · etapas vazias ficam à direita</div>';
    container.appendChild(sectionHead);

    var board = document.createElement("div");
    board.className = "board";
    container.appendChild(board);
    renderBoard(board);
  }

  function nextActionButton(it, stageKey) {
    if (stageKey === "RETORNADO") {
      return '<button class="advance-btn gold" data-action="mark-pronto" data-id="' + it.id + '">Marcar disponível p/ envio</button>';
    }
    if (stageKey === "PRONTO") {
      return '<button class="advance-btn" data-action="mark-enviado" data-id="' + it.id + '">Marcar enviado</button>';
    }
    return "";
  }

  function cardHtml(it, stage) {
    var a = ageDays(it);
    var stale = isStale(it);
    var ageLabel = a === null ? "sem data" : (a + (a === 1 ? " dia" : " dias"));
    return '<article class="card' + (stale ? ' is-stale' : '') + '" draggable="true" data-id="' + it.id + '" style="--stage-color:' + (stage.hex || stage.color) + '">' +
      '<div class="card-top">' +
        '<div><div class="card-title">' + escapeHtml(it.equipamento || "Equipamento") + '</div>' +
        '<div class="card-model">' + escapeHtml(it.marcaModelo || "") + '</div></div>' +
        '<button class="card-menu-btn" data-action="edit" data-id="' + it.id + '" aria-label="Editar" title="Editar">✎</button>' +
      '</div>' +
      '<div class="card-meta">' +
        '<div class="meta-field"><div class="l">Cliente</div><div class="v">' + escapeHtml(it.cliente || "—") + '</div></div>' +
        '<div class="meta-field"><div class="l">Unidade</div><div class="v">' + escapeHtml(it.unidade || "—") + '</div></div>' +
        '<div class="meta-field"><div class="l">OPM</div><div class="v">' + escapeHtml(it.opm || "—") + '</div></div>' +
        '<div class="meta-field"><div class="l">Nº série</div><div class="v">' + escapeHtml(it.numeroSerie || "—") + '</div></div>' +
      '</div>' +
      '<div class="card-tags">' + bitrixTag(it.statusBitrix) +
        (it.statusManutencaoNota ? '<span class="tag tag-nota">' + escapeHtml(it.statusManutencaoNota) + '</span>' : '') +
        (stale ? '<span class="tag tag-stale">parado há ' + a + ' dias</span>' : '') +
      '</div>' +
      '<div class="card-footer">' +
        '<span class="card-age">' + (stale ? "" : "há " + ageLabel) + '</span>' +
        '<div class="card-actions">' + nextActionButton(it, stage.key) + '</div>' +
      '</div>' +
      '<div class="card-move"><span>Etapa</span>' + stageSelectHtml(it, stage, false) + '</div>' +
    '</article>';
  }

  function renderBoard(board) {
    var visibleStages = STAGES.filter(function (s) {
      if (s.key === "PREVISTO") return state.equipamentos.some(function (it) { return computeStage(it).key === "PREVISTO"; });
      return true;
    });
    var withItems = [], empty = [];
    visibleStages.forEach(function (stage) {
      var count = state.equipamentos.filter(function (it) { return computeStage(it).key === stage.key; }).length;
      (count > 0 ? withItems : empty).push(stage);
    });
    visibleStages = withItems.concat(empty);

    board.innerHTML = visibleStages.map(function (stage) {
      var items = state.equipamentos.filter(function (it) { return computeStage(it).key === stage.key; });
      var cards = items.length
        ? items.map(function (it) { return cardHtml(it, stage); }).join("")
        : '<div class="column-empty">Nenhum equipamento</div>';
      return '<div class="column" data-stage="' + stage.key + '" style="--stage-color:' + (stage.hex || stage.color) + '">' +
        '<div class="column-head" data-filter="etapa:' + stage.key + '" title="Ver equipamentos desta etapa"><span class="name">' + stage.name + '</span><span class="count">' + items.length + '</span></div>' +
        '<div class="column-body">' + cards + '</div>' +
        '</div>';
    }).join("");
    bindCardEvents(board);
    bindFilterClicks(board);
    bindBoardDnD(board);
  }

  function bindCardEvents(root) {
    root.querySelectorAll('[data-action="move"]').forEach(function (sel) {
      sel.addEventListener("change", function () { moveTo(sel.getAttribute("data-id"), sel.value); });
    });
    root.querySelectorAll('[data-action="edit"]').forEach(function (btn) {
      btn.addEventListener("click", function () { openModal(btn.getAttribute("data-id")); });
    });
    root.querySelectorAll('[data-action="mark-pronto"]').forEach(function (btn) {
      btn.addEventListener("click", function () {
        var it = findItem(btn.getAttribute("data-id"));
        if (!it) return;
        setStage(it, "PRONTO");
        persist(); renderAll();
        toast("Marcado como disponível para envio");
      });
    });
    root.querySelectorAll('[data-action="mark-enviado"]').forEach(function (btn) {
      btn.addEventListener("click", function () {
        var it = findItem(btn.getAttribute("data-id"));
        if (!it) return;
        setStage(it, "ENVIADO");
        persist(); renderAll();
        toast("Marcado como enviado ao cliente");
      });
    });
  }

  function stageSelectHtml(it, stage, chip) {
    return '<select class="' + (chip ? 'stage-select-chip' : 'stage-select') + '" data-action="move" data-id="' + it.id + '" aria-label="Alterar etapa" style="--stage-color:' + (stage.hex || stage.color) + '">' +
      STAGES.map(function (s) { return '<option value="' + s.key + '"' + (s.key === stage.key ? ' selected' : '') + '>' + s.name + '</option>'; }).join("") +
      '</select>';
  }

  function moveTo(id, key) {
    var it = findItem(id);
    if (!it || !STAGE_MAP[key]) return;
    if (computeStage(it).key === key) { renderAll(); return; }
    setStage(it, key);
    persist(); renderAll();
    toast("Movido para: " + STAGE_MAP[key].name);
  }

  var dragId = null;
  function bindBoardDnD(board) {
    board.querySelectorAll('.card[draggable="true"]').forEach(function (c) {
      c.addEventListener("dragstart", function (e) {
        dragId = c.getAttribute("data-id");
        c.classList.add("dragging");
        try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (x) {}
      });
      c.addEventListener("dragend", function () {
        c.classList.remove("dragging");
        board.querySelectorAll(".column.drag-over").forEach(function (col) { col.classList.remove("drag-over"); });
        dragId = null;
      });
    });
    board.querySelectorAll(".column").forEach(function (col) {
      col.addEventListener("dragover", function (e) { if (!dragId) return; e.preventDefault(); col.classList.add("drag-over"); });
      col.addEventListener("dragleave", function (e) { if (!col.contains(e.relatedTarget)) col.classList.remove("drag-over"); });
      col.addEventListener("drop", function (e) {
        e.preventDefault();
        col.classList.remove("drag-over");
        var id = dragId; dragId = null;
        if (id) moveTo(id, col.getAttribute("data-stage"));
      });
    });
  }

  function goFilter(key) {
    var label;
    if (key.indexOf("etapa:") === 0) {
      var st = STAGE_MAP[key.slice(6)];
      label = "Etapa: " + (st ? st.name : key.slice(6));
    } else {
      label = CARD_FILTERS[key] ? CARD_FILTERS[key].label : key;
    }
    cardFilter = { key: key, label: label };
    tableFilterState = { search: "", cliente: "", tipo: "", etapa: "" };
    activeTab = "equipamentos";
    renderAll();
    window.scrollTo(0, 0);
  }
  function bindFilterClicks(root) {
    root.addEventListener("click", function (e) {
      var t = e.target.closest("[data-filter]");
      if (t && root.contains(t)) goFilter(t.getAttribute("data-filter"));
    });
    root.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var t = e.target.closest("[data-filter]");
      if (t && t === e.target) { e.preventDefault(); goFilter(t.getAttribute("data-filter")); }
    });
  }

  function fitResumo() {
    var st = document.getElementById("resumo-stage");
    if (!st) return;
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    st.style.transform = "scale(" + s + ")";
    st.style.left = ((window.innerWidth - 1920 * s) / 2) + "px";
    st.style.top = ((window.innerHeight - 1080 * s) / 2) + "px";
  }
  window.addEventListener("resize", fitResumo);

  function updateClock() {
    var t = document.getElementById("rs-time"), d = document.getElementById("rs-date");
    if (!t || !d) return;
    var now = new Date();
    t.textContent = now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    d.textContent = now.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  }

  function rsDays(it) {
    var a = ageDays(it);
    return a === null ? "—" : a + "d";
  }
  function rsNameHtml(it) {
    return '<div class="rs-name">' + escapeHtml(it.equipamento || "Equipamento") +
      (it.marcaModelo ? '<span>' + escapeHtml(it.marcaModelo) + '</span>' : '') + '</div>';
  }

  function renderResumo(container) {
    var items = state.equipamentos;
    function byAgeDesc(a, b) { return (ageDays(b) || 0) - (ageDays(a) || 0); }
    var ativos = items.filter(function (it) { return CARD_FILTERS.ativos.fn(it, computeStage(it).key); }).sort(byAgeDesc);
    var terceiros = items.filter(function (it) { return CARD_FILTERS.terceiros.fn(it, computeStage(it).key); });
    var prontos = items.filter(function (it) { return computeStage(it).key === "PRONTO"; }).sort(byAgeDesc);
    var enviados = items.filter(function (it) { return computeStage(it).key === "ENVIADO"; });
    var alertas = items.filter(isStale).sort(byAgeDesc);
    var ages = ativos.map(ageDays).filter(function (a) { return a !== null; });
    var media = ages.length ? Math.round(ages.reduce(function (a, b) { return a + b; }, 0) / ages.length) : 0;

    // pipeline
    var flowStages = STAGES.filter(function (s) {
      if (s.key === "PREVISTO") return items.some(function (it) { return computeStage(it).key === "PREVISTO"; });
      return true;
    });
    var flowHtml = flowStages.map(function (s) {
      var n = items.filter(function (it) { return computeStage(it).key === s.key; }).length;
      return '<div class="rs-step' + (n === 0 ? ' zero' : '') + '" style="--stage-color:' + (s.hex || s.color) + '">' +
        '<div class="n">' + n + '</div><div class="t">' + s.name + '</div></div>';
    }).join("");

    // lista: em manutenção
    var CAP = 7;
    var listA = ativos.length > CAP ? ativos.slice(0, CAP - 1) : ativos;
    var rowsA = listA.map(function (it) {
      var st = STAGE_MAP[computeStage(it).key];
      return '<div class="rs-row">' +
        '<div class="rs-chip" style="--stage-color:' + (st.hex || st.color) + '">' + st.name + '</div>' +
        rsNameHtml(it) +
        '<div class="rs-cli">' + escapeHtml(it.cliente || "—") + '</div>' +
        '<div class="rs-days' + (isStale(it) ? ' stale' : '') + '">' + rsDays(it) + '</div>' +
      '</div>';
    }).join("");
    if (ativos.length > CAP) rowsA += '<div class="rs-more">+ ' + (ativos.length - (CAP - 1)) + ' outros equipamentos em manutenção</div>';
    if (!ativos.length) rowsA = '<div class="rs-empty">Nenhum equipamento em manutenção</div>';

    // lista: disponíveis para envio
    var listP = prontos.length > 3 ? prontos.slice(0, 2) : prontos;
    var rowsP = listP.map(function (it) {
      return '<div class="rs-row compact">' + rsNameHtml(it) +
        '<div class="rs-cli">' + escapeHtml(it.cliente || "—") + '</div>' +
        '<div class="rs-days">' + rsDays(it) + '</div></div>';
    }).join("");
    if (prontos.length > 3) rowsP += '<div class="rs-more">+ ' + (prontos.length - 2) + ' outros disponíveis</div>';
    if (!prontos.length) rowsP = '<div class="rs-empty">Nenhum equipamento aguardando envio</div>';

    // lista: alertas
    var listW = alertas.length > 3 ? alertas.slice(0, 2) : alertas;
    var rowsW = listW.map(function (it) {
      var st = STAGE_MAP[computeStage(it).key];
      return '<div class="rs-row compact">' + rsNameHtml(it) +
        '<div class="rs-cli">' + escapeHtml(it.cliente || "—") + '</div>' +
        '<div class="rs-days stale">' + rsDays(it) + '</div></div>';
    }).join("");
    if (alertas.length > 3) rowsW += '<div class="rs-more">+ ' + (alertas.length - 2) + ' outros parados</div>';
    if (!alertas.length) rowsW = '<div class="rs-empty">Tudo em dia ✓</div>';

    // histórico
    var hTotal = historyData.length;
    var hGanhas = historyData.filter(function (h) { return /GANH/i.test(h.statusBitrix); }).length;
    var hPerdidas = historyData.filter(function (h) { return /PERD/i.test(h.statusBitrix); }).length;
    var hEntregues = historyData.filter(function (h) { return /ENTREGUE/i.test(h.statusManutencao); }).length;
    var pct = function (n) { return hTotal ? (n / hTotal * 100).toFixed(1) : 0; };

    container.innerHTML =

          '<div class="rs-div"></div>' +

          '<div class="rs-clock"><div class="rs-time" id="rs-time"></div><div class="rs-date" id="rs-date"></div></div>' +
        '</div>' +
        '<div class="rs-kpis">' +
          '<div class="rs-kpi hero"><div><div class="num">' + ativos.length + '</div><div class="lbl">' + (ativos.length === 1 ? "equipamento" : "equipamentos") + ' em manutenção<br>média de <b>' + media + ' dias</b> na etapa atual</div></div></div>' +
          '<div class="rs-kpi"><div class="ic">🛠️</div><div><div class="num">' + terceiros.length + '</div><div class="lbl">aguardando<br>fornecedor</div></div></div>' +
          '<div class="rs-kpi good"><div class="ic">📦</div><div><div class="num">' + prontos.length + '</div><div class="lbl">disponíveis<br>para envio</div></div></div>' +
          '<div class="rs-kpi"><div class="ic">✅</div><div><div class="num">' + enviados.length + '</div><div class="lbl">enviados<br>ao cliente</div></div></div>' +
          '<div class="rs-kpi' + (alertas.length ? ' warn' : '') + '"><div class="ic">⚠️</div><div><div class="num">' + alertas.length + '</div><div class="lbl">parados há<br>20+ dias</div></div></div>' +
        '</div>' +
        '<div class="rs-flow">' + flowHtml + '</div>' +

          '<div class="m"><span class="n">' + hGanhas + '</span><span class="l">ganhas</span></div>' +
          '<div class="m"><span class="n">' + hPerdidas + '</span><span class="l">perdidas</span></div>' +
          '<div class="m"><span class="n">' + hEntregues + '</span><span class="l">entregues ao cliente</span></div>' +
          '<div class="rs-bar" title="Ganhas x perdidas"><i style="width:' + pct(hGanhas) + '%;background:var(--sage)"></i><i style="width:' + pct(hPerdidas) + '%;background:var(--terracotta)"></i></div>' +
        '</div>' +
      '</div></div>';
    updateClock();
    fitResumo();
  }

  // menu flutuante (a barra lateral fica oculta na tela de resumo)
  document.getElementById("btn-resumo-menu").addEventListener("click", function () {
    document.getElementById("app-shell").classList.add("peek");
  });
  document.getElementById("resumo-backdrop").addEventListener("click", function () {
    document.getElementById("app-shell").classList.remove("peek");
  });

  // relógio e atualização automática (TV): a cada 30s relógio; a cada 10 min recalcula; a cada 15 min recarrega a página
  var tickCount = 0;
  setInterval(function () {
    if (activeTab !== "resumo") return;
    tickCount++;
    updateClock();
    var modalOpen = modalRoot && modalRoot.innerHTML;
    if (tickCount % 20 === 0 && !modalOpen) {
      TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
      renderAll();
    }
    if (tickCount >= 30 && !modalOpen) { try { location.reload(); } catch (e) {} }
  }, 30000);

  /* ---------------- Equipamentos (tabela) ---------------- */
  var tableFilterState = { search: "", cliente: "", tipo: "", etapa: "" };

  function uniqueSorted(arr) {
    var seen = {}, out = [];
    arr.forEach(function (v) { if (v && !seen[v]) { seen[v] = 1; out.push(v); } });
    return out.sort();
  }

  function renderEquipamentos(container, topbarFilters) {
    var banner = document.createElement("div");
    banner.className = "page-banner";
    banner.innerHTML = '<div><h2>Todos os equipamentos</h2><p id="table-count-hint"></p></div>' +
      (cardFilter ? '<div class="filter-chip">Filtro: ' + escapeHtml(cardFilter.label) + ' <button id="btn-clear-cardfilter" aria-label="Limpar filtro" title="Limpar filtro">✕</button></div>' : '');
    container.appendChild(banner);
    var clearBtn = banner.querySelector("#btn-clear-cardfilter");
    if (clearBtn) clearBtn.addEventListener("click", function () { cardFilter = null; renderAll(); });

    var clientes = uniqueSorted(state.equipamentos.map(function (it) { return it.cliente; }));
    var tipos = uniqueSorted(state.equipamentos.map(function (it) { return it.equipamento; }));

    topbarFilters.innerHTML =
      '<input class="filter-select" type="search" id="f-search" placeholder="Buscar..." style="min-width:160px;">' +
      '<select class="filter-select" id="f-cliente"><option value="">Todos os clientes</option>' +
        clientes.map(function (c) { return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>'; }).join("") +
      '</select>' +
      '<select class="filter-select" id="f-tipo"><option value="">Todos os tipos</option>' +
        tipos.map(function (c) { return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>'; }).join("") +
      '</select>' +
      '<select class="filter-select" id="f-etapa"><option value="">Todas as etapas</option>' +
        STAGES.map(function (s) { return '<option value="' + s.key + '">' + s.name + '</option>'; }).join("") +
      '</select>';

    document.getElementById("f-search").value = tableFilterState.search;
    document.getElementById("f-cliente").value = tableFilterState.cliente;
    document.getElementById("f-tipo").value = tableFilterState.tipo;
    document.getElementById("f-etapa").value = tableFilterState.etapa;

    var tableWrap = document.createElement("div");
    tableWrap.className = "table-wrap";
    tableWrap.innerHTML =
      '<table><thead><tr>' +
        '<th>Equipamento</th><th>Cliente</th><th>Unidade</th><th>OPM</th><th>Etapa</th><th>Parado há</th><th>CRM</th><th></th>' +
      '</tr></thead><tbody id="table-body"></tbody></table>';
    container.appendChild(tableWrap);

    var emptyEl = document.createElement("div");
    emptyEl.id = "table-empty";
    emptyEl.style.display = "none";
    emptyEl.className = "empty-state";
    emptyEl.innerHTML = '<div class="icon">🔍</div><h3>Nada encontrado</h3><p>Ajuste os filtros ou o termo de busca.</p>';
    container.appendChild(emptyEl);

    function refreshTable() {
      var search = tableFilterState.search.toLowerCase();
      var rows = state.equipamentos.filter(function (it) {
        if (tableFilterState.cliente && it.cliente !== tableFilterState.cliente) return false;
        if (tableFilterState.tipo && it.equipamento !== tableFilterState.tipo) return false;
        var stage = computeStage(it);
        if (!matchCardFilter(it)) return false;
        if (tableFilterState.etapa && stage.key !== tableFilterState.etapa) return false;
        if (search) {
          var hay = [it.cliente, it.equipamento, it.marcaModelo, it.numeroSerie, it.opm, it.unidade].join(" ").toLowerCase();
          if (hay.indexOf(search) === -1) return false;
        }
        return true;
      });

      document.getElementById("table-count-hint").textContent =
        rows.length + " de " + state.equipamentos.length + (state.equipamentos.length === 1 ? " equipamento" : " equipamentos");

      var tbody = document.getElementById("table-body");
      if (!rows.length) {
        tbody.innerHTML = "";
        emptyEl.style.display = "";
        return;
      }
      emptyEl.style.display = "none";

      tbody.innerHTML = rows.map(function (it) {
        var stage = STAGE_MAP[computeStage(it).key];
        var a = ageDays(it);
        var ageTxt = a === null ? "—" : (a + (a === 1 ? " dia" : " dias"));
        return "<tr>" +
          "<td><div class='cell-strong'>" + escapeHtml(it.equipamento || "") + "</div><div class='cell-soft'>" + escapeHtml(it.marcaModelo || "") + "</div></td>" +
          "<td>" + escapeHtml(it.cliente || "—") + "</td>" +
          "<td>" + escapeHtml(it.unidade || "—") + "</td>" +
          "<td>" + escapeHtml(it.opm || "—") + "</td>" +
          "<td>" + stageSelectHtml(it, stage, true) + "</td>" +
          "<td>" + ageTxt + (isStale(it) ? " ⚠" : "") + "</td>" +
          "<td>" + bitrixTag(it.statusBitrix) + "</td>" +
          "<td><div class='row-actions'><button class='icon-btn' data-action='edit' data-id='" + it.id + "' title='Editar'>✎</button></div></td>" +
          "</tr>";
      }).join("");
      bindCardEvents(tbody);
    }

    ["f-search","f-cliente","f-tipo","f-etapa"].forEach(function (id) {
      var el = document.getElementById(id);
      var key = id.replace("f-", "");
      el.addEventListener("input", function () { tableFilterState[key] = el.value; refreshTable(); });
      el.addEventListener("change", function () { tableFilterState[key] = el.value; refreshTable(); });
    });

    refreshTable();
  }


  /* ---------------- Histórico (somente leitura) ---------------- */
  var historyData = [];
  try { historyData = JSON.parse(document.getElementById("history-data").textContent || "[]"); } catch (e) { historyData = []; }
  var histFilter = { search: "", cliente: "", situacao: "", entrega: "" };

  function fmtDate(s) {
    var d = parseDate(s);
    return d ? d.toLocaleDateString("pt-BR") : "—";
  }
  function histSortKey(h) {
    return h.chegada || h.envioAssistencia || h.proposta || h.aprovacao || h.retorno || "";
  }
  function histChip(status) {
    if (!status) return '<span class="hist-chip hist-neutro">—</span>';
    var u = status.toUpperCase(), cls = "hist-neutro";
    if (u.indexOf("GANH") !== -1) cls = "hist-ganha";
    else if (u.indexOf("PERD") !== -1) cls = "hist-perdida";
    return '<span class="hist-chip ' + cls + '">' + escapeHtml(status) + '</span>';
  }

  function renderHistorico(container, topbarFilters) {
    var ganhas = historyData.filter(function (h) { return /GANH/i.test(h.statusBitrix); }).length;
    var perdidas = historyData.filter(function (h) { return /PERD/i.test(h.statusBitrix); }).length;
    var entregues = historyData.filter(function (h) { return /ENTREGUE/i.test(h.statusManutencao); }).length;

    var banner = document.createElement("div");
    banner.className = "page-banner";
    banner.innerHTML =
      '<div><h2>Histórico de manutenções</h2><p id="hist-count-hint"></p></div>' +
      '<div class="banner-stats">' +
        '<div><div class="n">' + historyData.length + '</div><div class="t">registros</div></div>' +
        '<div><div class="n">' + ganhas + '</div><div class="t">ganhas</div></div>' +
        '<div><div class="n">' + perdidas + '</div><div class="t">perdidas</div></div>' +
        '<div><div class="n">' + entregues + '</div><div class="t">entregues ao cliente</div></div>' +
      '</div>';
    container.appendChild(banner);

    var clientes = uniqueSorted(historyData.map(function (h) { return h.cliente; }));
    var situacoes = uniqueSorted(historyData.map(function (h) { return h.statusBitrix; }));
    var entregas = uniqueSorted(historyData.map(function (h) { return h.statusManutencao; }));

    function opts(list) { return list.map(function (c) { return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>'; }).join(""); }
    topbarFilters.innerHTML =
      '<input class="filter-select" type="search" id="h-search" placeholder="Buscar..." style="min-width:160px;">' +
      '<select class="filter-select" id="h-cliente"><option value="">Todos os clientes</option>' + opts(clientes) + '</select>' +
      '<select class="filter-select" id="h-situacao"><option value="">Todas as situações</option>' + opts(situacoes) + '</select>' +
      '<select class="filter-select" id="h-entrega"><option value="">Qualquer entrega</option>' + opts(entregas) + '</select>';
    document.getElementById("h-search").value = histFilter.search;
    document.getElementById("h-cliente").value = histFilter.cliente;
    document.getElementById("h-situacao").value = histFilter.situacao;
    document.getElementById("h-entrega").value = histFilter.entrega;

    var wrap = document.createElement("div");
    wrap.className = "table-wrap";
    wrap.innerHTML = '<table><thead><tr>' +
      '<th>Equipamento</th><th>Cliente</th><th>OPM</th><th>Chegada</th><th>Retorno</th><th>Assistência</th><th>Situação</th><th>Entrega</th>' +
      '</tr></thead><tbody id="hist-body"></tbody></table>';
    container.appendChild(wrap);

    var emptyEl = document.createElement("div");
    emptyEl.className = "empty-state";
    emptyEl.style.display = "none";
    emptyEl.innerHTML = '<div class="icon">🔍</div><h3>Nada encontrado</h3><p>Ajuste os filtros ou o termo de busca.</p>';
    container.appendChild(emptyEl);

    function refresh() {
      var q = histFilter.search.toLowerCase();
      var rows = historyData.filter(function (h) {
        if (histFilter.cliente && h.cliente !== histFilter.cliente) return false;
        if (histFilter.situacao && h.statusBitrix !== histFilter.situacao) return false;
        if (histFilter.entrega && h.statusManutencao !== histFilter.entrega) return false;
        if (q) {
          var hay = [h.equipamento, h.marcaModelo, h.numeroSerie, h.cliente, h.unidade, h.opm, h.assistencia, h.defeito, h.obs, h.os, h.nf].join(" ").toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      }).sort(function (a, b) { return histSortKey(b).localeCompare(histSortKey(a)); });

      document.getElementById("hist-count-hint").textContent = rows.length + " de " + historyData.length + " registros";
      var tbody = document.getElementById("hist-body");
      if (!rows.length) { tbody.innerHTML = ""; emptyEl.style.display = ""; return; }
      emptyEl.style.display = "none";
      tbody.innerHTML = rows.map(function (h) {
        return "<tr class='clickable' data-id='" + h.id + "'>" +
          "<td><div class='cell-strong'>" + escapeHtml(h.equipamento || "—") + "</div><div class='cell-soft'>" + escapeHtml(h.marcaModelo || "") + "</div></td>" +
          "<td><div>" + escapeHtml(h.cliente || "—") + "</div><div class='cell-soft'>" + escapeHtml(h.unidade || "") + "</div></td>" +
          "<td>" + escapeHtml(h.opm || "—") + "</td>" +
          "<td>" + fmtDate(h.chegada) + "</td>" +
          "<td>" + fmtDate(h.retorno) + "</td>" +
          "<td>" + escapeHtml(h.assistencia || "—") + "</td>" +
          "<td>" + histChip(h.statusBitrix) + "</td>" +
          "<td>" + (h.statusManutencao ? histChip(h.statusManutencao) : "<span class='cell-soft'>—</span>") + "</td>" +
          "</tr>";
      }).join("");
      tbody.querySelectorAll("tr.clickable").forEach(function (tr) {
        tr.addEventListener("click", function () { openHistDetail(tr.getAttribute("data-id")); });
      });
    }

    [["h-search","search"],["h-cliente","cliente"],["h-situacao","situacao"],["h-entrega","entrega"]].forEach(function (p) {
      var el = document.getElementById(p[0]);
      var fn = function () { histFilter[p[1]] = el.value; refresh(); };
      el.addEventListener("input", fn); el.addEventListener("change", fn);
    });
    refresh();
  }

  function openHistDetail(id) {
    var h = null;
    for (var i = 0; i < historyData.length; i++) if (historyData[i].id === id) h = historyData[i];
    if (!h) return;
    function f(label, value, full) {
      return '<div' + (full ? ' class="full"' : '') + '><div class="l">' + label + '</div><div class="v">' + (value ? escapeHtml(value) : "—") + '</div></div>';
    }
    modalRoot.innerHTML =
      '<div class="modal-overlay" id="modal-overlay"><div class="modal" role="dialog" aria-modal="true">' +
        '<h3>' + escapeHtml(h.equipamento || "Equipamento") + (h.marcaModelo ? " — " + escapeHtml(h.marcaModelo) : "") + '</h3>' +
        '<p class="modal-sub">' + escapeHtml(h.cliente || "") + (h.unidade ? " / " + escapeHtml(h.unidade) : "") + '</p>' +
        '<div class="detail-grid">' +
          f("OPM", h.opm) + f("Nº de série", h.numeroSerie) +
          f("Chegada", fmtDate(h.chegada)) + f("Envio p/ assistência", fmtDate(h.envioAssistencia)) +
          f("Proposta", fmtDate(h.proposta)) + f("Aprovação", fmtDate(h.aprovacao)) +
          f("Retorno", fmtDate(h.retorno)) + f("Finalização na assistência", fmtDate(h.finalizacao)) +
          f("Assistência", h.assistencia) + f("Prazo", fmtDate(h.prazo)) +
          f("OS", h.os) + f("NF de remessa", h.nf) +
          f("Situação (Bitrix)", h.statusBitrix) + f("Entrega", h.statusManutencao) +
          f("Defeito encontrado", h.defeito, true) +
          f("Observações", h.obs, true) +
        '</div>' +
        '<div class="modal-footer"><span></span><div class="right"><button class="btn btn-primary" id="btn-close-detail">Fechar</button></div></div>' +
      '</div></div>';
    document.getElementById("modal-overlay").addEventListener("click", function (e) { if (e.target.id === "modal-overlay") closeModal(); });
    document.getElementById("btn-close-detail").addEventListener("click", closeModal);
    document.addEventListener("keydown", escListener);
  }

  /* ---------------- Modal (add / edit) ---------------- */
  var modalRoot = document.createElement("div");
  document.body.appendChild(modalRoot);

  var FORM_FIELDS = [
    { key: "equipamento", label: "Equipamento", type: "text", placeholder: "Ex: Projetor" },
    { key: "marcaModelo", label: "Marca / Modelo", type: "text", placeholder: "Ex: Epson 2250U" },
    { key: "numeroSerie", label: "Nº de série", type: "text" },
    { key: "patrimonio", label: "Patrimônio", type: "text" },
    { key: "cliente", label: "Cliente", type: "text" },
    { key: "unidade", label: "Unidade", type: "text" },
    { key: "opm", label: "OPM", type: "text" },
    { key: "statusBitrix", label: "Status CRM (Bitrix)", type: "select", options: ["Entrada", "Em andamento", "Em avaliação técnica", "Proposta Enviada", "Confirmada", "Oportunidade ganha", "Negócio perdido"] },
    { key: "chegada", label: "Chegada na KVM", type: "date" },
    { key: "envioAssistencia", label: "Envio p/ assistência", type: "date" },
    { key: "orcamento", label: "Orçamento assistência", type: "date" },
    { key: "proposta", label: "Proposta enviada", type: "date" },
    { key: "aprovacao", label: "Aprovação", type: "date" },
    { key: "retorno", label: "Retorno da assistência", type: "date" },
    { key: "statusManutencaoNota", label: "Nota (ex: EM BANCADA)", type: "text", span2: true }
  ];

  function blankItem() { return { id: "eq-" + Date.now().toString(36) }; }

  function openModal(id) {
    var item = id ? findItem(id) : blankItem();
    if (!item) return;

    var fieldsHtml = FORM_FIELDS.map(function (f) {
      var val = item[f.key] || "";
      if (f.type === "select") {
        var opts = f.options.slice();
        if (val && opts.indexOf(val) === -1) opts.push(val);
        return '<div class="field' + (f.span2 ? ' span2' : '') + '">' +
          '<label for="fld-' + f.key + '">' + f.label + '</label>' +
          '<select id="fld-' + f.key + '"><option value="">—</option>' +
          opts.map(function (o) { return '<option value="' + escapeHtml(o) + '"' + (o === val ? ' selected' : '') + '>' + escapeHtml(o) + '</option>'; }).join("") +
          '</select></div>';
      }
      return '<div class="field' + (f.span2 ? ' span2' : '') + '">' +
        '<label for="fld-' + f.key + '">' + f.label + '</label>' +
        '<input id="fld-' + f.key + '" type="' + f.type + '" value="' + escapeHtml(val) + '"' +
        (f.placeholder ? ' placeholder="' + escapeHtml(f.placeholder) + '"' : '') + '>' +
        '</div>';
    }).join("");

    var autoName = STAGE_MAP[computeAuto(item).key].name;
    var readyFieldHtml =
      '<div class="field span2"><label for="fld-etapa">Etapa</label>' +
      '<select id="fld-etapa"><option value="__auto">Automática (pelas datas) — atual: ' + escapeHtml(autoName) + '</option>' +
      STAGES.map(function (s) { return '<option value="' + s.key + '">' + s.name + '</option>'; }).join("") +
      '</select></div>';

    modalRoot.innerHTML =
      '<div class="modal-overlay" id="modal-overlay">' +
        '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
          '<h3 id="modal-title">' + (id ? "Editar equipamento" : "Adicionar equipamento") + '</h3>' +
          '<p class="modal-sub">' + (id ? "Atualize os dados e datas do processo de manutenção." : "Preencha os dados do equipamento recebido.") + '</p>' +
          '<div class="form-grid">' + fieldsHtml + readyFieldHtml + '</div>' +
          '<div class="modal-footer">' +
            (id ? '<button class="danger-link" id="btn-delete">Excluir equipamento</button>' : '<span></span>') +
            '<div class="right">' +
              '<button class="btn btn-ghost" id="btn-cancel">Cancelar</button>' +
              '<button class="btn btn-primary" id="btn-save">Salvar</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById("fld-etapa").value = item.etapaManual || "__auto";

    document.getElementById("modal-overlay").addEventListener("click", function (e) {
      if (e.target.id === "modal-overlay") closeModal();
    });
    document.getElementById("btn-cancel").addEventListener("click", closeModal);
    document.getElementById("btn-save").addEventListener("click", function () { saveModal(item, !!id); });
    var delBtn = document.getElementById("btn-delete");
    if (delBtn) delBtn.addEventListener("click", function () { deleteItem(item.id); });

    document.addEventListener("keydown", escListener);
  }

  function escListener(e) { if (e.key === "Escape") closeModal(); }
  function closeModal() {
    modalRoot.innerHTML = "";
    document.removeEventListener("keydown", escListener);
  }

  function saveModal(item, isEdit) {
    FORM_FIELDS.forEach(function (f) {
      var el = document.getElementById("fld-" + f.key);
      var v = el.value.trim();
      item[f.key] = v || null;
    });
    var wasManual = !!item.etapaManual;
    var sel = document.getElementById("fld-etapa").value;
    if (sel === "__auto") {
      if (wasManual) { item.etapaManual = null; item.etapaDesde = null; item.prontoParaEnvio = false; item.enviado = false; }
    } else if (sel !== item.etapaManual) {
      setStage(item, sel);
    }
    if (!item.equipamento) item.equipamento = "Equipamento";

    if (!isEdit) state.equipamentos.push(item);
    closeModal();
    persist();
    renderAll();
    toast(isEdit ? "Equipamento atualizado" : "Equipamento adicionado");
  }

  function deleteItem(id) {
    if (!window.confirm("Excluir este equipamento do painel?")) return;
    state.equipamentos = state.equipamentos.filter(function (it) { return it.id !== id; });
    closeModal();
    persist();
    renderAll();
    toast("Equipamento removido");
  }

  document.getElementById("btn-add").addEventListener("click", function () { openModal(null); });

  /* ---------------- Init ---------------- */
  renderAll();
})();
</script>
</body>
</html>
